name: Tech Digest – 5:00 AM ICT (tin hot)

on:
  # Kích hoạt chính: scheduled task của Claude đẩy 1 commit vào trigger/ lúc ~4:55 ICT.
  # Lịch cron của GitHub thường trễ 2–4 tiếng nên không dùng làm giờ chính.
  push:
    branches: [main]
    paths: ["trigger/**"]

  # Dự phòng: nếu 5:00 không có ai kích hoạt, cron này chạy (dù trễ).
  # Bot tự bỏ qua nếu hôm nay đã có bản tin.
  schedule:
    - cron: "40 21 * * *"   # 4:40 ICT danh nghĩa

  workflow_dispatch:
    inputs:
      force:
        description: "Chạy lại kể cả khi hôm nay đã có bản tin"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tech-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -U feedparser google-genai requests

      - name: Run digest bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN:          ${{ inputs.force || contains(github.event.head_commit.message, '[force]') }}
        run: python digest.py

      # Lưu bản tin vào repo để bước viết tin 6:00 đọc (và giữ repo luôn "hoạt động",
      # tránh GitHub tự tắt workflow sau 60 ngày)
      - name: Commit digest JSON
        run: |
          git config user.name  "tech-digest-bot"
          git config user.email "tech-digest-bot@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "digest $(TZ=Asia/Bangkok date +%F)"
            git pull --rebase origin main
            git push
          fi
